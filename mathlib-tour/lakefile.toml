name = "mathlib-tour"

# Build output goes to the disposable tree at Projects/_buildoutput/,
# which is safe to delete wholesale; Lake recreates it on the next build.
# Static path, not $VAR: lakefile.toml does not interpolate the environment.
buildDir = "/Users/thv/Claude/Projects/_buildoutput/lean/mathlib-tour"

# Shared dependency store; see ../../_lean-packages/README.md.
packagesDir = "/Users/thv/Claude/Projects/_lean-packages/v4.33.0"
defaultTargets = ["MathlibTour"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0"

[[lean_lib]]
name = "MathlibTour"
